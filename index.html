<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A searchable directory of sample users loaded from an API.">
  <title>User Directory</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="container">
    <header class="page-header">
      <p class="eyebrow">DIRECTORY</p>
      <h1>User Directory</h1>
      <p class="intro">Load and search sample user information from an external API.</p>
    </header>

    <section class="controls" aria-label="Directory controls">
      <button id="loadButton" type="button">Load users</button>
      <label class="search-label" for="searchInput">Search by name or email</label>
      <input
        id="searchInput"
        type="search"
        placeholder="For example, Leanne or Sincere"
        autocomplete="off"
        disabled
      >
    </section>

    <p id="message" class="message" role="status" aria-live="polite">
      Select “Load users” to retrieve the directory.
    </p>

    <section id="userList" class="user-grid" aria-label="User results"></section>
  </main>
</body>
</html>
